name: probe

# Checks the site every hour and saves the results on the `data` branch.
# Rules and file formats: docs/DATA_FORMATS.md.
on:
  schedule:
    - cron: '17 * * * *'  # hourly at :17 UTC; off the top of the hour, when GitHub's scheduler is busiest
  workflow_dispatch:

permissions:
  contents: write         # to push to the data branch

concurrency:
  group: data-branch      # shared with cleanup.yml, so they never push at the same time
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04   # pinned, so a runner upgrade cannot change things silently
    timeout-minutes: 30     # a full outage takes about 4 minutes
    steps:
      - uses: actions/checkout@v5
        with:
          path: main

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install prober dependencies
        run: pip install --quiet -r main/prober/requirements.txt

      - name: Check out the data branch
        run: bash main/.github/scripts/data-branch.sh checkout main data

      - name: Probe
        run: python main/prober/probe.py --data-dir data

      - name: Save results
        run: bash main/.github/scripts/data-branch.sh push data "Probe $(date -u +%Y-%m-%dT%H:%MZ)"
