name: cleanup

# Once a day, deletes raw run files older than 30 days from the `data` branch.
# daily.json and current.json are never touched.
on:
  schedule:
    - cron: '17 3 * * *'  # daily at 03:17 UTC (queues behind the 03:17 probe run; that is fine)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-branch      # shared with probe.yml
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          path: main

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check out the data branch
        run: bash main/.github/scripts/data-branch.sh checkout main data

      - name: Delete raw files older than 30 days
        run: python main/prober/cleanup.py --data-dir data --keep-days 30

      - name: Save
        run: bash main/.github/scripts/data-branch.sh push data "Clean up raw files older than 30 days"
